[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"
[project]
name = "rootpath-rehearsal"
version = "0.1.0"
description = "Local ASGI rehearsal of reverse-proxy URL wiring"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi==0.162.0","httpx==0.28.1"]
[project.scripts]
rootpath-rehearsal = "rootpath_rehearsal:main"
[tool.setuptools]
py-modules = ["rootpath_rehearsal"]
